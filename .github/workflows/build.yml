name: Build client

on:
  push:
    branches: ["run"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or commit of pxdns/clientjar to build"
        default: "main"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo apt-get clean
          df -h / | tail -n 1

      - name: Check access token
        env:
          TOKEN: ${{ secrets.CLIENTJAR_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Secret CLIENTJAR_TOKEN is not set (needs Contents: Read-only on pxdns/clientjar)."
            exit 1
          fi

      - name: Check out clientjar (private)
        uses: actions/checkout@v4
        with:
          repository: pxdns/clientjar
          ref: ${{ inputs.ref || 'main' }}
          token: ${{ secrets.CLIENTJAR_TOKEN }}
          path: clientjar
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Check runner memory
        run: |
          free -m
          avail=$(awk '/MemAvailable/{print int($2/1024)}' /proc/meminfo)
          echo "available: ${avail} MiB"
          [ "$avail" -ge 12300 ] || { echo "::error::Only ${avail} MiB free; the build needs 12300+."; exit 1; }

      - name: Build
        shell: bash
        working-directory: clientjar
        run: bash scripts/ci-build.sh 2>&1 | tee ../build.log

      - name: Collect output
        if: always()
        run: |
          mkdir -p ci-out
          cp clientjar/builds/tempest-26.2-client.html ci-out/ 2>/dev/null || true
          cp clientjar/builds/tempest-26.2-client.html.br ci-out/ 2>/dev/null || true
          tail -n 300 build.log > ci-out/build-tail.log || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tempest-26.2-client
          path: ci-out/
          if-no-files-found: warn
          retention-days: 7
